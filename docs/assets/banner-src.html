<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#fff;
background:linear-gradient(135deg,#04202c 0%,#006688 100%);display:flex;align-items:center;padding:0 90px;gap:60px;overflow:hidden;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(#33c4e844,transparent 70%)}
.t{flex:1;z-index:1}
.badge{display:inline-block;padding:6px 16px;border:1.5px solid #ffffff66;border-radius:99px;font-size:22px;margin-bottom:26px;letter-spacing:2px}
h1{font-size:110px;font-weight:800;letter-spacing:6px;line-height:1.05}
h2{font-size:38px;font-weight:500;margin:18px 0 34px;color:#bfe9f7}
ul{list-style:none;font-size:28px;line-height:1.75;color:#e6f6fb}
li:before{content:"✓ ";color:#5fe3b0;font-weight:700}
.shield{width:300px;height:300px;z-index:1;flex:none}
.phone{width:280px;height:600px;border-radius:38px;border:8px solid #0b1b22;overflow:hidden;z-index:1;flex:none;margin-top:90px;box-shadow:0 20px 60px #0008;background:#fff}
.phone img{width:100%;display:block}
</style>
<div class="glow"></div>
<div class="t">
<div class="badge">ANDROID 11+ · 无需 ROOT · 开源 GPL-3.0</div>
<h1>哨兵</h1>
<h2>不 root 的 Android 广告拦截</h2>
<ul><li>网络 · 界面 · 通知 · 系统 四层协同</li><li>每个自动操作都可撤销，一键临时放行</li><li>故障只会让拦截变弱，不会断网</li></ul>
</div>
<div class="phone"><img src="shot-home.png"></div>
